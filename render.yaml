# Render Blueprint: API service + Postgres. The website is a Cloudflare Worker (see client/wrangler.jsonc).
databases:
  - name: domainforge-db
    plan: free            # free Postgres expires after a fixed period; see docs/DEPLOYMENT.md
    databaseName: domainforge
    user: domainforge

services:
  - type: web
    name: domainforge-api
    runtime: node
    plan: free            # sleeps after ~15 min idle; first request afterwards takes about a minute
    buildCommand: npm ci --omit=dev
    startCommand: npm run migrate -w server && npm run start -w server
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: domainforge-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: TRUST_PROXY_HOPS      # Cloudflare Worker + Render's router
        value: "2"
      - key: PROXY_SHARED_SECRET   # you provide this; must equal the Worker secret
        sync: false
      - key: CLIENT_URL            # your Worker URL, e.g. https://domainforge-web.<you>.workers.dev
        sync: false
